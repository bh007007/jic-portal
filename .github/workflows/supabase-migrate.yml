name: Supabase 테이블 반영

# main 에 supabase/migrations 변경이 들어오면 Supabase DB에 적용한다.
# 저장소 Settings > Secrets and variables > Actions 에 SUPABASE_DB_URL 이 있어야 하고,
# 없으면 건너뛴다(그동안은 Supabase SQL Editor에서 직접 실행).
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: 시크릿 확인
        id: check
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL 시크릿이 없어 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - name: 마이그레이션 적용
        if: steps.check.outputs.skip != 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
