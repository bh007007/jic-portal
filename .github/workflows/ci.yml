name: 빌드 확인

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run admin:build
      - run: npm run partner:build
      - run: npm run student:build
      - run: npm run intranet:build
      - run: npm run teacher:build
      # 학생 앱·인트라넷 DB 권한(RLS)과 학생 앱 배포 서버 시험: PGlite(Postgres) 위에 마이그레이션을 올려 확인한다(의존성에 넣지 않고 임시 설치).
      - run: npm i --no-save @electric-sql/pglite@0.3
      - run: node supabase/tests/student_intranet_rls.mjs
      - run: node supabase/tests/student_worker_api.mjs
      - run: node supabase/tests/intranet_worker_api.mjs
      - run: node supabase/tests/teacher_portal_rls.mjs
      - run: node supabase/tests/user_directory_rls.mjs
      - run: node supabase/tests/attendance_rls.mjs
      - run: node supabase/tests/roles_rls.mjs
      - run: node supabase/tests/legacy_extend_rls.mjs
      - run: node supabase/tests/change_requests_rls.mjs
      - run: node supabase/tests/absence_penalties_rls.mjs
      - run: node supabase/tests/intranet_roles_rls.mjs
      - run: node supabase/tests/intranet_manager_rls.mjs
      - run: node supabase/tests/student_timetable_rls.mjs
      - run: node supabase/tests/lms_course_timeline_rls.mjs
      - run: node supabase/tests/partner_reco_rls.mjs
      - run: node supabase/tests/core_schema.mjs
      - run: node supabase/tests/core_schema_adapter.mjs
      - run: node supabase/tests/security_lint.mjs
      - run: node supabase/tests/partner_tuition_rls.mjs
      - run: node supabase/tests/partner_staff_rls.mjs
      - run: node supabase/tests/partner_content_rls.mjs
